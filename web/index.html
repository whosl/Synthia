<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthia 工程治理平台</title>
    <script>
      try {
        const saved = localStorage.getItem("synthia.theme");
        document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {}
    </script>
    <style>
      .boot-shell { --boot-bg: #f7f7f5; --boot-panel: #fff; --boot-line: #e9e9e5; --boot-text: #65665f; position: fixed; inset: 0; overflow: auto; z-index: 1; background: var(--boot-bg); color: var(--boot-text); font: 14px system-ui, sans-serif; }
      [data-theme=dark] .boot-shell { --boot-bg: #191a18; --boot-panel: #22231f; --boot-line: #30312b; --boot-text: #b7b9ad; }
      .boot-shell header { height: 64px; display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid var(--boot-line); font-size: 20px; font-weight: 600; }
      .boot-content { max-width: 1120px; margin: 0 auto; padding: 40px 24px; }.boot-title { width: 190px; height: 30px; margin: 24px 0; }.boot-stats { height: 84px; margin: 28px 0; }
      .boot-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }.boot-card { min-height: 160px; padding: 24px; border: 1px solid var(--boot-line); border-radius: 10px; background: var(--boot-panel); }
      .boot-bar { display: block; background: var(--boot-line); border-radius: 6px; animation: boot-pulse 1.6s ease-in-out infinite; }.boot-card i { height: 14px; margin-bottom: 20px; }.boot-card i:first-child { width: 40px; height: 32px; }.boot-card i:last-child { width: 60%; }
      #boot-retry { margin: 16px 0; padding: 8px 14px; color: inherit; border: 1px solid var(--boot-line); background: var(--boot-panel); border-radius: 6px; cursor: pointer; }
      @keyframes boot-pulse { 50% { opacity: .45; } } @media (prefers-reduced-motion: reduce) { .boot-bar { animation: none; } }
      @media (max-width: 700px) { .boot-grid { grid-template-columns: 1fr; }.boot-card:nth-child(n+3) { display: none; }.boot-content { padding: 24px 16px; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell" role="status" aria-live="polite" aria-busy="true" aria-label="正在加载 Synthia">
        <header>synthia</header>
        <main class="boot-content">
          <p id="boot-message">正在加载工作空间…</p>
          <button id="boot-retry" type="button" hidden onclick="location.reload()">重新加载</button>
          <noscript>请启用 JavaScript 后重新加载页面。</noscript>
          <div aria-hidden="true">
            <div class="boot-bar boot-title"></div><div class="boot-bar boot-stats"></div>
            <div class="boot-grid">
              <div class="boot-card"><i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i></div>
              <div class="boot-card"><i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i></div>
              <div class="boot-card"><i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i></div>
              <div class="boot-card"><i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i></div>
              <div class="boot-card"><i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i></div>
              <div class="boot-card"><i class="boot-bar"></i><i class="boot-bar"></i><i class="boot-bar"></i></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script>
      setTimeout(() => {
        const message = document.getElementById("boot-message");
        const retry = document.getElementById("boot-retry");
        if (message && retry) {
          message.textContent = "加载时间较长，请检查网络，或刷新重试。";
          retry.hidden = false;
        }
      }, 12000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
