events {}
http {
  server {
    listen 127.0.0.1:18443;
    server_name _;
    client_max_body_size 2m;

    location / {
      proxy_pass https://192.168.31.66:8443;
      proxy_http_version 1.1;
      proxy_set_header Host DESKTOP-DVFFB09;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_ssl_server_name on;
      proxy_ssl_name DESKTOP-DVFFB09;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /etc/nginx/mtls/client-ca.pem;
      proxy_ssl_certificate /etc/nginx/mtls/origin-client.crt.pem;
      proxy_ssl_certificate_key /etc/nginx/mtls/origin-client.key.pem;
      proxy_connect_timeout 10s;
      proxy_read_timeout 300s;
    }
  }
}
